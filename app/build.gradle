plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def nativeInput = layout.projectDirectory.dir(
    providers.gradleProperty("novaNativeDir").getOrElse("../build/recovery/android"))
def officialEngine = providers.gradleProperty("novaOfficialEngine").orElse("false").get().toBoolean()
def nativeRecovery = providers.gradleProperty("novaNativeRecovery").orElse("false").get().toBoolean()
def windowProbe = providers.gradleProperty("novaWindowProbe").orElse("false").get().toBoolean()
def rebuiltEngine = providers.gradleProperty("novaRebuiltEngine").orElse("false").get().toBoolean()
if (rebuiltEngine && (!nativeRecovery || officialEngine)) {
    throw new GradleException("The rebuilt APK requires the rebuilt runtime and private bundled assets.")
}
if (windowProbe && !(officialEngine || rebuiltEngine)) {
    throw new GradleException("The probe requires the official or rebuilt 4 KiB engine.")
}
def recoveryKeystore = providers.environmentVariable("NOVA_SIGNING_KEYSTORE").orNull

android {
    namespace "com.novahd.recomp"
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.novahd.recomp"
        minSdk 26
        targetSdk 34
        versionCode(rebuiltEngine ? 15 : windowProbe ? 9 : (nativeRecovery ? 8 : 7))
        versionName(rebuiltEngine ? "0.14-recovery-arm64-4k" : windowProbe ? "0.8.2-probe-arm64-4k" : nativeRecovery ? "0.8.1-recovery" : (officialEngine ? "0.7-recovery-arm64-4k" : "0.7-recovery"))
        buildConfigField "boolean", "OFFICIAL_ENGINE", officialEngine.toString()
        
        buildConfigField "boolean", "FOUR_KIB_ONLY", (officialEngine || rebuiltEngine).toString()
        buildConfigField "boolean", "REBUILT_ENGINE", rebuiltEngine.toString()
        buildConfigField "boolean", "WINDOW_PROBE", windowProbe.toString()

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    if (windowProbe) {
        externalNativeBuild.ndkBuild.path = file("src/extension/Android.mk")
    }

    if (recoveryKeystore) {
        signingConfigs.debug {
            storeFile file(recoveryKeystore)
            storePassword System.getenv("NOVA_SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("NOVA_SIGNING_ALIAS")
            keyPassword System.getenv("NOVA_SIGNING_KEY_PASSWORD")
        }
    }

    sourceSets.main {
        java.srcDir("../android-common/src/main/java")
        jniLibs.srcDir(nativeInput.dir("jni"))
        assets.srcDir(nativeInput.dir("assets"))
    }

    androidResources {
        noCompress += ["bin"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            if (officialEngine || rebuiltEngine) keepDebugSymbols += ["**/libnovahd.so"]
        }
    }
}

def verifyRecoveryInputs = tasks.register("verifyRecoveryInputs") {
    doLast {
        def lib = nativeInput.file("jni/arm64-v8a/libnovahd.so").asFile
        def image = nativeInput.file("assets/image.bin").asFile
        if (!lib.isFile() || lib.length() == 0 || !image.isFile() || image.length() == 0) {
            throw new GradleException("Recovery requires ARM64 libnovahd.so and image.bin. See the Recovery build guides.")
        }
        if (!nativeInput.file("assets/NovaHD.app/Info.plist").asFile.isFile()) {
            throw new GradleException("Recovery requires the verified original campaign assets. See docs/RECOVERY-v0.5.md.")
        }
        lib.withInputStream { stream ->
            byte[] header = stream.readNBytes(20)
            if (header.length != 20 || header[0] != 127 || header[1] != 69 || header[2] != 76
                    || header[3] != 70 || header[4] != 2 || header[5] != 1
                    || header[18] != (byte) 183 || header[19] != 0) {
                throw new GradleException("The recovery library must be a little-endian AArch64 ELF64.")
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ["packageDebug", "packageRelease"]) task.dependsOn(verifyRecoveryInputs)
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}
