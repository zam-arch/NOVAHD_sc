name: Build N.O.V.A. HD APK (ARM64)

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      checked:
        description: "Build with RECOMP_CHECKED (bounds checks, call chain in crashes)"
        type: boolean
        default: false
      bundle:
        description: "Path to NovaHD.app folder to include in APK (optional)"
        type: string
        required: false

permissions:
  contents: read

env:
  CACHE_PREFIX: novahd
  NDK_VERSION: "27.0.12077973"
  API_LEVEL: "26"

jobs:
  build-apk:
    name: Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          api-level: ${{ env.API_LEVEL }}
          platform-tools: true
          build-tools: "34.0.0"
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install capstone unicorn ziglang
      
      - name: Cache build artifacts
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            build/recomp-android
            build/recomp-android-checked
          key: ${{ env.CACHE_PREFIX }}-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-build-${{ runner.os }}-
      
      - name: Build APK (release)
        if: github.event.inputs.checked != "true"
        run: |
          cd ${{ github.workspace }}
          python3 tools/recomp/build_apk.py \
            --exe ${{ env.EXE_PATH }} \
            --out build/apk \
            --bundle ${{ env.BUNDLE_PATH }}
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Build APK (checked)
        if: github.event.inputs.checked == "true"
        run: |
          cd ${{ github.workspace }}
          python3 tools/recomp/build_apk.py \
            --exe ${{ env.EXE_PATH }} \
            --out build/apk \
            --bundle ${{ env.BUNDLE_PATH }} \
            --checked
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Verify APK
        if: always()
        run: |
          ls -la build/apk/
          if [ -f build/apk/novahd-recomp.apk ]; then
            echo "APK built successfully: build/apk/novahd-recomp.apk"
            echo "APK_SIZE=$(stat -c%s build/apk/novahd-recomp.apk)" >> $GITHUB_OUTPUT
            echo "APK_PATH=build/apk/novahd-recomp.apk" >> $GITHUB_OUTPUT
          else
            echo "APK not found, checking for errors..."
            exit 1
          fi
        id: verify
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outputs.APK_PATH != ""
        with:
          name: novahd-recomp-apk-${{ github.sha }}
          path: ${{ steps.verify.outputs.APK_PATH }}
          retention-days: 30
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, "refs/tags/v")
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.verify.outputs.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apk-windows:
    name: Build ARM64 APK (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          api-level: ${{ env.API_LEVEL }}
          platform-tools: true
          build-tools: "34.0.0"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install capstone unicorn ziglang
      
      - name: Cache build artifacts
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            build/recomp-android
            build/recomp-android-checked
          key: ${{ env.CACHE_PREFIX }}-build-windows-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-build-windows-${{ runner.os }}-
      
      - name: Build APK (release)
        if: github.event.inputs.checked != "true"
        run: |
          cd ${{ github.workspace }}
          python tools/recomp/build_apk.py `
            --exe ${{ env.EXE_PATH }} `
            --out build/apk `
            --bundle ${{ env.BUNDLE_PATH }}
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Build APK (checked)
        if: github.event.inputs.checked == "true"
        run: |
          cd ${{ github.workspace }}
          python tools/recomp/build_apk.py `
            --exe ${{ env.EXE_PATH }} `
            --out build/apk `
            --bundle ${{ env.BUNDLE_PATH }} `
            --checked
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Verify APK
        if: always()
        run: |
          ls build/apk/
          if (Test-Path build/apk/novahd-recomp.apk) {
            echo "APK built successfully: build/apk/novahd-recomp.apk"
            $size = (Get-Item build/apk/novahd-recomp.apk).Length
            echo "APK_SIZE=$size" >> $env:GITHUB_OUTPUT
            echo "APK_PATH=build/apk/novahd-recomp.apk" >> $env:GITHUB_OUTPUT
          } else {
            echo "APK not found"
            exit 1
          }
        id: verify
        shell: powershell
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outputs.APK_PATH != ""
        with:
          name: novahd-recomp-apk-windows-${{ github.sha }}
          path: ${{ steps.verify.outputs.APK_PATH }}
          retention-days: 30
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, "refs/tags/v")
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.verify.outputs.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
