name: Build N.O.V.A. HD APK (ARM64)

on:
  push:
    branches: [development, feature/android-build-verification]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.5"

jobs:
  build-app:
    name: Build Android App (ResourceManager)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble debug and release
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: novahd-resource-manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
