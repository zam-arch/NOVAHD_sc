name: Build N.O.V.A. HD APK (ARM64)

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      checked:
        description: "Build with RECOMP_CHECKED (bounds checks, call chain in crashes)"
        type: boolean
        default: false
      bundle:
        description: "Path to NovaHD.app folder to include in APK (optional)"
        type: string
        required: false

permissions:
  contents: read

env:
  CACHE_PREFIX: novahd
  NDK_VERSION: "27.0.12077973"
  API_LEVEL: "26"
  GRADLE_VERSION: "8.5"

jobs:
  build-apk:
    name: Build ARM64 APK (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          api-level: ${{ env.API_LEVEL }}
          platform-tools: true
          build-tools: "34.0.0"
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install capstone unicorn ziglang
      
      - name: Cache build artifacts
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            build/recomp-android
            build/recomp-android-checked
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.CACHE_PREFIX }}-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-build-${{ runner.os }}-
      
      - name: Build native library (recompilation)
        if: github.event.inputs.checked != "true"
        run: |
          cd ${{ github.workspace }}
          python3 tools/recomp/build_apk.py \
            --exe ${{ env.EXE_PATH }} \
            --out build/apk \
            --bundle ${{ env.BUNDLE_PATH }} \
            --runtime-only
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Build native library (checked)
        if: github.event.inputs.checked == "true"
        run: |
          cd ${{ github.workspace }}
          python3 tools/recomp/build_apk.py \
            --exe ${{ env.EXE_PATH }} \
            --out build/apk \
            --bundle ${{ env.BUNDLE_PATH }} \
            --checked \
            --runtime-only
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Copy native library to app module
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ -f build/apk/libnovahd.so ]; then
            cp build/apk/libnovahd.so app/src/main/jniLibs/arm64-v8a/
            echo "Copied libnovahd.so"
          else
            echo "WARNING: libnovahd.so not found, will build without native lib"
          fi
      
      - name: Build Android App (Gradle)
        run: |
          cd ${{ github.workspace }}
          ./gradlew assembleRelease --no-daemon -x lint
      
      - name: Verify APK
        if: always()
        run: |
          ls -la app/build/outputs/apk/release/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK built successfully: app/build/outputs/apk/release/app-release.apk"
            echo "APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)" >> $GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
          else
            echo "APK not found"
            exit 1
          fi
        id: verify
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outputs.APK_PATH != ""
        with:
          name: novahd-recomp-apk-${{ github.sha }}
          path: ${{ steps.verify.outputs.APK_PATH }}
          retention-days: 30
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, "refs/tags/v")
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.verify.outputs.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apk-windows:
    name: Build ARM64 APK (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          api-level: ${{ env.API_LEVEL }}
          platform-tools: true
          build-tools: "34.0.0"
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install capstone unicorn ziglang
      
      - name: Cache build artifacts
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            build/recomp-android
            build/recomp-android-checked
            ~\.gradle\caches
            ~\.gradle\wrapper
          key: ${{ env.CACHE_PREFIX }}-build-windows-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-build-windows-${{ runner.os }}-
      
      - name: Build native library (recompilation)
        if: github.event.inputs.checked != "true"
        run: |
          cd ${{ github.workspace }}
          python tools/recomp/build_apk.py `
            --exe ${{ env.EXE_PATH }} `
            --out build/apk `
            --bundle ${{ env.BUNDLE_PATH }} `
            --runtime-only
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Build native library (checked)
        if: github.event.inputs.checked == "true"
        run: |
          cd ${{ github.workspace }}
          python tools/recomp/build_apk.py `
            --exe ${{ env.EXE_PATH }} `
            --out build/apk `
            --bundle ${{ env.BUNDLE_PATH }} `
            --checked `
            --runtime-only
        env:
          EXE_PATH: ${{ github.event.inputs.exe || "" }}
          BUNDLE_PATH: ${{ github.event.inputs.bundle || "" }}
        continue-on-error: true
      
      - name: Copy native library to app module
        run: |
          mkdir app/src/main/jniLibs/arm64-v8a
          if (Test-Path build/apk/libnovahd.so) {
            cp build/apk/libnovahd.so app/src/main/jniLibs/arm64-v8a/
            echo "Copied libnovahd.so"
          } else {
            echo "WARNING: libnovahd.so not found"
          }
        shell: powershell
      
      - name: Build Android App (Gradle)
        run: |
          cd ${{ github.workspace }}
          ./gradlew.bat assembleRelease --no-daemon -x lint
        shell: powershell
      
      - name: Verify APK
        if: always()
        run: |
          ls app/build/outputs/apk/release/
          if (Test-Path app/build/outputs/apk/release/app-release.apk) {
            echo "APK built successfully: app/build/outputs/apk/release/app-release.apk"
            $size = (Get-Item app/build/outputs/apk/release/app-release.apk).Length
            echo "APK_SIZE=$size" >> $env:GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> $env:GITHUB_OUTPUT
          } else {
            echo "APK not found"
            exit 1
          }
        id: verify
        shell: powershell
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.verify.outputs.APK_PATH != ""
        with:
          name: novahd-recomp-apk-windows-${{ github.sha }}
          path: ${{ steps.verify.outputs.APK_PATH }}
          retention-days: 30
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, "refs/tags/v")
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.verify.outputs.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
